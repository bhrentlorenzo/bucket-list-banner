<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bucket List Banner</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    /* === Reset & Base === */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Lato', sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* === Banner === */
    .banner {
      background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
      border: 2px solid #e94560;
      border-radius: 16px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(233,69,96,0.3);
    }

    .banner h1 {
      font-family: 'Playfair Display', serif;
      color: #e94560;
      font-size: 2rem;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .banner p.subtitle {
      color: #a8b2d8;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    /* === List === */
    #bucket-list {
      list-style: none;
      margin-bottom: 28px;
    }

    #bucket-list li {
      color: #ccd6f6;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      transition: color 0.3s;
    }

    #bucket-list li::before {
      content: "✦ ";
      color: #e94560;
    }

    /* === Input Area === */
    .input-area {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    #new-item {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #e94560;
      background: rgba(255,255,255,0.05);
      color: #ccd6f6;
      font-family: 'Lato', sans-serif;
      font-size: 0.95rem;
      outline: none;
    }

    #new-item::placeholder { color: #4a5568; }

    /* === Buttons === */
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Lato', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); }

    /* Add button */
    #btn-add {
      background: #e94560;
      color: #fff;
      box-shadow: 0 4px 15px rgba(233,69,96,0.4);
    }

    /* Font family button */
    #btn-font {
      background: #0f3460;
      color: #a8b2d8;
      border: 1px solid #a8b2d8;
    }

    /* Bold button */
    #btn-bold {
      background: #533483;
      color: #fff;
      box-shadow: 0 4px 15px rgba(83,52,131,0.4);
    }
  </style>
</head>
<body>

  <!-- ===== BODY CONTENT ===== -->
  <div class="banner">
    <h1>🌍 My Bucket List</h1>
    <p class="subtitle">Things I want to explore in my lifetime</p>

    <!-- List of things to explore -->
    <ul id="bucket-list">
      <li>Travel to Japan and experience cherry blossom season</li>
      <li>Be a Pro Esports Player</li>
      <li>Meet Cong TV</li>
      <li>Have a Business</li>
      <li>Be successful</li>
    </ul>

    <!-- Input field for adding new items -->
    <div class="input-area">
      <input type="text" id="new-item" placeholder="Add something new..."/>
    </div>

    <!-- Button group -->
    <div class="btn-group">
      <!-- Button 1: Add new item from input field -->
      <button id="btn-add" onclick="addItem()">＋ Add Item</button>
      <!-- Button 2: Change font family of list items -->
      <button id="btn-font" onclick="changeFont()">🔤 Change Font</button>
      <!-- Button 3: Toggle bold on list items -->
      <button id="btn-bold" onclick="toggleBold()">B Bold</button>
    </div>
  </div>

  <!-- ===== SCRIPT ===== -->
  <script>
    /**
     * Font families to cycle through when the Change Font button is clicked.
     * Each click rotates to the next font in the array.
     */
    const fonts = ['Lato', 'Georgia', 'Courier New', 'Arial', "'Playfair Display'"];
    let fontIndex = 0; // Tracks which font is currently active

    /**
     * addItem()
     * Reads the value from the input field and appends a new <li> to the list.
     * Clears the input field after adding. Alerts user if input is empty.
     */
    function addItem() {
      const input = document.getElementById('new-item');
      const value = input.value.trim(); // Remove extra whitespace

      if (value === '') {
        alert('Please enter something first!');
        return;
      }

      // Create and append new list item
      const li = document.createElement('li');
      li.textContent = value;
      document.getElementById('bucket-list').appendChild(li);

      // Apply current styling to the new item
      applyCurrentStyles(li);

      input.value = ''; // Clear the input field
    }

    /**
     * changeFont()
     * Cycles through the fonts array and applies the next font family
     * to all list items currently in the bucket list.
     */
    function changeFont() {
      fontIndex = (fontIndex + 1) % fonts.length; // Move to next font
      const items = document.querySelectorAll('#bucket-list li');
      items.forEach(item => {
        item.style.fontFamily = fonts[fontIndex];
      });
    }

    /**
     * toggleBold()
     * Toggles the font-weight of all list items between normal and bold.
     * Uses a data attribute to track the current state.
     */
    function toggleBold() {
      const list = document.getElementById('bucket-list');
      const isBold = list.dataset.bold === 'true';

      const items = list.querySelectorAll('li');
      items.forEach(item => {
        item.style.fontWeight = isBold ? 'normal' : 'bold';
      });

      // Update state tracker
      list.dataset.bold = !isBold;
    }

    /**
     * applyCurrentStyles(element)
     * Applies the currently active font and bold state to a newly added list item,
     * so it matches the existing items visually.
     * @param {HTMLElement} element - The new <li> element to style
     */
    function applyCurrentStyles(element) {
      element.style.fontFamily = fonts[fontIndex];
      const list = document.getElementById('bucket-list');
      element.style.fontWeight = list.dataset.bold === 'true' ? 'bold' : 'normal';
    }

    /**
     * Allow pressing Enter in the input field to add an item.
     */
    document.getElementById('new-item').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') addItem();
    });
  </script>

</body>
</html>
